<!doctype html>

    .liquid-glass::before, .liquid-glass-strong::before { content:""; position:absolute; inset:0; border-radius:inherit; padding:1.4px; background:linear-gradient(180deg,rgba(255,255,255,.45) 0%,rgba(255,255,255,.15) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.15) 80%,rgba(255,255,255,.45) 100%); -webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0); -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none; }
    .liquid-glass-strong { backdrop-filter: blur(50px); -webkit-backdrop-filter: blur(50px); box-shadow:4px 4px 4px rgba(0,0,0,.05),inset 0 1px 1px rgba(255,255,255,.15); }
    .liquid-glass-strong::before { background:linear-gradient(180deg,rgba(255,255,255,.5) 0%,rgba(255,255,255,.2) 20%,rgba(255,255,255,0) 40%,rgba(255,255,255,0) 60%,rgba(255,255,255,.2) 80%,rgba(255,255,255,.5) 100%); }

<body>
<div id="root"></div>
<script type="text/babel">
const { useEffect, useRef, useState } = React;
const motion = (window.Motion && window.Motion.motion) || (({ initial, animate, transition, children, ...props }) => React.createElement('div', props, children));
const heroVideo = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4';
const capabilityVideo = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4';
function Arrow(){return <svg viewBox="0 0 24 24" className="h-5 w-5" fill="none" stroke="currentColor"><path d="M7 17 17 7M7 7h10v10" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
function Play(){return <svg viewBox="0 0 24 24" className="h-4 w-4" fill="currentColor"><path d="m6 4 14 8-14 8V4Z"/></svg>}
function FadingVideo({src,className,style}){const ref=useRef(null), raf=useRef(null), out=useRef(false); useEffect(()=>{const v=ref.current; if(!v)return; const fadeTo=(target,duration=500)=>{cancelAnimationFrame(raf.current); const start=performance.now(), from=parseFloat(v.style.opacity||0); const step=now=>{const p=Math.min(1,(now-start)/duration); v.style.opacity=String(from+(target-from)*p); if(p<1)raf.current=requestAnimationFrame(step)}; raf.current=requestAnimationFrame(step)}; const loaded=()=>{v.style.opacity='0';v.play().catch(()=>{});fadeTo(1)}; const time=()=>{if(!out.current&&v.duration-v.currentTime<=.55&&v.duration-v.currentTime>0){out.current=true;fadeTo(0)}}; const ended=()=>{v.style.opacity='0';setTimeout(()=>{v.currentTime=0;v.play().catch(()=>{});out.current=false;fadeTo(1)},100)}; v.addEventListener('loadeddata',loaded);v.addEventListener('timeupdate',time);v.addEventListener('ended',ended); if(v.readyState>=2)loaded(); return()=>{cancelAnimationFrame(raf.current);v.removeEventListener('loadeddata',loaded);v.removeEventListener('timeupdate',time);v.removeEventListener('ended',ended)}} ,[]); return <video ref={ref} autoPlay muted playsInline preload="auto" className={className} style={{opacity:0,...style}} src={src}/>}
function BlurText({text,className}){const [visible,setVisible]=useState(false), ref=useRef(null); useEffect(()=>{const o=new IntersectionObserver(([e])=>e.isIntersecting&&setVisible(true),{threshold:.1}); if(ref.current)o.observe(ref.current);return()=>o.disconnect()},[]); return <p ref={ref} className={className}>{text.split(' ').map((w,i)=><motion.span key={i} initial={{filter:'blur(10px)',opacity:0,y:50}} animate={visible?{filter:['blur(10px)','blur(5px)','blur(0px)'],opacity:[0,.5,1],y:[50,-5,0]}:{}} transition={{duration:.7,delay:i*.1,ease:'easeOut',times:[0,.5,1]}} style={{display:'inline-block',marginRight:'.28em'}}>{w}</motion.span>)}</p>}
const enter={initial:{filter:'blur(10px)',opacity:0,y:20},animate:{filter:'blur(0px)',opacity:1,y:0},transition:{duration:.7,ease:'easeOut'}};
const stats=[['34.5 Min','Average Videos Watch Time'],['2.8B+','Users Across the Globe']];
const cards=[['AI Scenery','image','Natural Context','Photo Realism','Infinite Settings','Eco-Vibe','AI analyzes your product to create indistinguishable natural environments — from Icelandic cliffs to misty forests.'],['Batch Production','movie','Scale Fast','Visual Consistency','Time Saver','Ready to Post','Style your entire product line in minutes. Create a unified visual identity for catalogues and social media without weeks of retouching.'],['Smart Lighting','bulb','Ray Tracing','Physical Shadows','Studio Quality','Sunlight Sync','Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight.']];
const paths={image:'M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z',movie:'M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z',bulb:'M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z'};
function Navbar(){return <nav className="fixed top-4 left-0 right-0 z-50 flex items-center justify-between px-8 lg:px-16"><div className="liquid-glass flex h-12 w-12 items-center justify-center rounded-full font-heading text-3xl italic">a</div><div className="liquid-glass hidden items-center gap-1 rounded-full p-1.5 md:flex">{['Home','Voyages','Worlds','Innovation','Plan Launch'].map(x=><a key={x} href="#capabilities" className="px-3 py-2 text-sm font-medium text-white/90">{x}</a>)}<a href="#launch" className="flex items-center gap-2 rounded-full bg-white px-4 py-2 text-sm font-medium text-black">Claim a Spot <Arrow/></a></div><div className="h-12 w-12"/></nav>}
function Hero(){return <section className="relative flex min-h-screen flex-col overflow-hidden bg-black"><FadingVideo src={heroVideo} className="absolute left-1/2 top-0 z-0 -translate-x-1/2 object-cover object-top" style={{width:'120%',height:'120%'}}/><div className="relative z-10 flex flex-1 flex-col"><Navbar/><div className="flex flex-1 flex-col items-center justify-center px-4 pt-24 text-center"><motion.div {...enter} transition={{...enter.transition,delay:.4}} className="liquid-glass flex items-center gap-2 rounded-full px-1.5 py-1.5"><span className="rounded-full bg-white px-3 py-1 text-xs font-semibold text-black">New</span><span className="pr-3 text-sm text-white/90">Maiden Crewed Voyage to Mars Arrives 2026</span></motion.div><BlurText text="Venture Past Our Sky Across the Universe" className="mt-7 flex max-w-2xl flex-wrap justify-center font-heading text-6xl italic leading-[.8] tracking-[-4px] text-white md:text-7xl lg:text-[5.5rem]"/><motion.p {...enter} transition={{...enter.transition,delay:.8}} className="mt-4 max-w-2xl text-sm font-body font-light leading-tight text-white md:text-base">Discover the universe in ways once unimaginable. Our pioneering vessels and breakthrough engineering bring deep-space exploration within reach—secure and extraordinary.</motion.p><motion.div {...enter} transition={{...enter.transition,delay:1.1}} className="mt-6 flex items-center gap-6"><a id="launch" href="#capabilities" className="liquid-glass-strong flex items-center gap-2 rounded-full px-5 py-2.5 text-sm font-medium text-white">Start Your Voyage <Arrow/></a><a href="#capabilities" className="flex items-center gap-2 text-sm text-white">View Liftoff <Play/></a></motion.div><motion.div {...enter} transition={{...enter.transition,delay:1.3}} className="mt-8 flex items-stretch gap-4">{stats.map(([n,l],i)=><div key={n} className="liquid-glass w-[220px] rounded-[1.25rem] p-5 text-left"><div className="mb-7 text-white">{i===0?<svg viewBox="0 0 24 24" className="h-7 w-7" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>:<svg viewBox="0 0 24 24" className="h-7 w-7" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>}</div><div className="font-heading text-4xl italic leading-none tracking-[-1px] text-white">{n}</div><div className="mt-2 text-xs font-body font-light text-white">{l}</div></div>)}</motion.div></div><motion.div {...enter} transition={{...enter.transition,delay:1.4}} className="flex flex-col items-center gap-4 pb-8"><div className="liquid-glass rounded-full px-3.5 py-1 text-xs font-medium text-white">Collaborating with top aerospace pioneers globally</div><div className="flex flex-wrap justify-center gap-8 font-heading text-2xl italic tracking-tight text-white md:gap-16 md:text-3xl">{['Aeon','Vela','Apex','Orbit','Zeno'].map(x=><span key={x}>{x}</span>)}</div></motion.div></div></section>}
function Capabilities(){return <section id="capabilities" className="relative min-h-screen overflow-hidden bg-black"><FadingVideo src={capabilityVideo} className="absolute inset-0 z-0 h-full w-full object-cover"/><div className="relative z-10 flex min-h-screen flex-col px-8 pb-10 pt-24 md:px-16 lg:px-20"><div className="mb-auto"><div className="mb-6 text-sm text-white/80">// Capabilities</div><h2 className="max-w-3xl font-heading text-6xl italic leading-[.9] tracking-[-3px] text-white md:text-7xl lg:text-[6rem]">Production<br/>evolved</h2></div><div className="mt-16 grid grid-cols-1 gap-6 md:grid-cols-3">{cards.map(([title,icon,...rest])=>{const tags=rest.slice(0,4),body=rest[4];return <motion.article key={title} {...enter} className="liquid-glass flex min-h-[360px] flex-col rounded-[1.25rem] p-6"><div className="flex items-start justify-between gap-4"><div className="liquid-glass flex h-11 w-11 shrink-0 items-center justify-center rounded-[.75rem] text-white"><svg viewBox="0 0 24 24" className="material h-6 w-6"><path d={paths[icon]}/></svg></div><div className="flex max-w-[70%] flex-wrap justify-end gap-1.5">{tags.map(t=><span key={t} className="liquid-glass whitespace-nowrap rounded-full px-3 py-1 text-[11px] text-white/90">{t}</span>)}</div></div><div className="flex-1"/><h3 className="font-heading text-3xl italic leading-none tracking-[-1px] text-white md:text-4xl">{title}</h3><p className="mt-3 max-w-[32ch] text-sm font-body font-light leading-snug text-white/90">{body}</p></motion.article>})}</div></div></section>}
function App(){return <><Hero/><Capabilities/></>}; ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
